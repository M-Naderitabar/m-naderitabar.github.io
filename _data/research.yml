  - title: Oil Price Volatility and the Asymmetric Transmission of Energy Shocks
    coauthors:
      - name: Alireza Azampour
        url: https://arazampour.com/
    status: Working paper
    # Paraphrased from https://arazampour.com/#jmp.
    summary: >-
      We study why oil price increases reduce investment more than price declines
      stimulate it, and why this asymmetry grows with the size of the shock.
      Evidence from oil-supply shocks in the EU links this investment response to
      greater dispersion in energy prices. In a model with firms that differ in
      energy intensity, price dispersion increases uncertainty about returns and
      discourages investment, amplifying contractions after price increases and
      dampening expansions after price declines.
    abstract:
    paper_url: https://arazampour.com/files/jmp.pdf
    slides_url: https://arazampour.com/files/jmp-slides.pdf
