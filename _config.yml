# Personal information. Restart Jekyll after editing this file.
locale: en-US
title: Mohammad Naderitabar
name: Mohammad Naderitabar
description: >-
  Mohammad Naderitabar is a PhD candidate in Economics at IIES,
  Stockholm University. Research in macroeconomics, industrial organization,
  innovation, and information economics.
url: "https://m-naderitabar.github.io"
baseurl: ""
repository: "M-Naderitabar/m-naderitabar.github.io"
timezone: Europe/Stockholm

author:
  name: Mohammad Naderitabar
  avatar: /images/profile.jpg
  bio: PhD Candidate in Economics
  employer: IIES, Stockholm University
  location: Stockholm, Sweden
  email: mohammad.naderitabar@iies.su.se
  github: M-Naderitabar
  twitter: MohammadNaderit

affiliation:
  institute: Institute for International Economic Studies
  short_name: IIES
  institute_url: https://www.su.se/english/divisions/institute-for-international-economic-studies
  university: Stockholm University
  university_url: https://www.su.se/english/

# Replace this file to update the CV download across the site.
cv_pdf: /files/CV_Mohammad_Naderitabar.pdf

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
include:
  - _pages
  - files
# Retain original theme tooling without publishing its demo material.
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - vendor
  - node_modules
  - local
  - scripts
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - _posts
  - _drafts
  - _portfolio
  - _publications
  - _talks
  - _teaching
  - files/bibtex1.bib
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/500x300.png
  - images/editing-talk.png
  - images/themes
  - images/manifest.json
  - images/favicon.svg
  - images/favicon.ico
  - images/favicon-32x32.png
  - images/favicon-192x192.png
  - images/favicon-512x512.png
  - images/apple-touch-icon-180x180.png

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
# Compatibility with the original theme's optional stylesheets.
site_theme: default
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
